const CATS = [["games", "🎮 Games"], ["3d", "🧱 3D"], ["web", "🕸️ Web"], ["video", "🎬 Video"], ["apps", "📦 Apps"], ["agent", "🖱️ Agent"], ["engineering", "⚙️ Engineering"], ["research", "🔬 Research"], ["prompts", "📝 Prompts"]];
const TIERS = [["featured","⭐ featured"],["notable","✦ notable"],["community","· community"]];
const state = {cat:"all", tier:"all", prompt:"all", q:""};
const $ = s => document.querySelector(s);
function chips(host, items, key){
  items.forEach(([v,label]) => {
    const b=document.createElement("button");
    b.textContent=label; b.dataset.v=v;
    b.setAttribute("aria-pressed", state[key]===v);
    b.onclick=()=>{state[key]=v; render();};
    host.appendChild(b);
  });
}
function render(){
  document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed", state.cat===b.dataset.v));
  document.querySelectorAll("#tiers button").forEach(b=>b.setAttribute("aria-pressed", state.tier===b.dataset.v));
  const q=state.q.toLowerCase();
  const rows=DATA.filter(e =>
    (state.cat==="all"||e.category===state.cat) &&
    (state.tier==="all"||e.tier===state.tier) &&
    (state.prompt==="all"||(state.prompt==="yes")===e.has_prompt) &&
    (!q || [e.title,e.author,e.what,e.why,(e.tags||[]).join(" "),(e.signals||[]).join(" ")].join(" ").toLowerCase().includes(q))
  );
  const g=$("#grid"); g.innerHTML="";
  $("#count").textContent = rows.length + " of " + DATA.length + " entries";
  rows.forEach(e=>{
    const c=document.createElement("article"); c.className="card";
    const srcTxt={github:"GitHub",x:"X",web:"Web",hf:"Hugging Face"}[e.source_platform]||e.source_platform;
    const stars = (e.stars!==null&&e.stars!==undefined) ? " · ★ "+e.stars : "";
    c.innerHTML = `<h3>${esc(e.title)}</h3>
      <div class="meta">
        <span class="pill ${e.tier[0]}">${e.tier}</span>
        <span class="pill">${e.category}</span>
        <span class="pill">${e.kind}</span>
        ${e.has_prompt?'<span class="pill p">prompt</span>':''}
      </div>
      <div class="what">${esc(e.what)}</div>
      <div class="why">${esc(e.why)}</div>
      <div class="src">by <b>${esc(e.author)}</b> · <a href="${e.source_url}" target="_blank" rel="noopener">${srcTxt}${stars}</a></div>`;
    g.appendChild(c);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
chips($("#cats"), [["all","all categories"],...CATS], "cat");
chips($("#tiers"), [["all","all tiers"],...TIERS], "tier");
const pf=document.createElement("button"); pf.textContent="has prompt";
pf.onclick=()=>{state.prompt = state.prompt==="yes"?"all":"yes"; pf.setAttribute("aria-pressed",state.prompt==="yes"); render();};
$("#tiers").appendChild(pf);
$("#q").addEventListener("input",e=>{state.q=e.target.value; render();});
render();
</script>
