name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  recipes:
    name: Validate prompt recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate every recipe against the schema
        run: python3 scripts/validate_prompts.py

      - name: Check the README index is in sync
        run: python3 scripts/build_index.py --check
